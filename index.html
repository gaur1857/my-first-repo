<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Delivery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
    }
    header {
      background-color: #ff4d4d;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav {
      background-color: #333;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .hero {
      background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') no-repeat center center/cover;
      height: 300px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    button {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>🍔 FoodExpress</h1>
  <p>Fast & Fresh Food Delivery</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Menu</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>

<div class="hero">
  Order Your Favorite Food
</div>

<div class="container">
  <h2>Our Menu</h2>
  <div class="menu">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1601924638867-3ec2f4a6c8f3" alt="Pizza">
      <h3>Pizza</h3>
      <p>₹299</p>
      <button>Order Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1550547660-d9450f859349" alt="Burger">
      <h3>Burger</h3>
      <p>₹149</p>
      <button>Order Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1604908177522-4021f1d0e0aa" alt="Pasta">
      <h3>Pasta</h3>
      <p>₹199</p>
      <button>Order Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950" alt="Biryani">
      <h3>Biryani</h3>
      <p>₹249</p>
      <button>Order Now</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 FoodExpress | All Rights Reserved</p>
</footer>

</body>
</html>
